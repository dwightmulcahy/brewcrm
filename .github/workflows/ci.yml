name: CI

on:
  push:
    branches: ["**"]          # branches only; tags are handled by release.yml
  pull_request:
  workflow_call:              # reused by release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  IMAGE: app:ci
  PORT: "8080"
  # Throwaway credentials for the ephemeral smoke-test container only
  # Mixed case on purpose: the entrypoint must normalise it
  SMOKE_ADMIN_EMAIL: Smoke-Admin@Example.com
  SMOKE_ADMIN_PASSWORD: smoke-only-password-123

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --check all .js/.mjs
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.js' '*.mjs')
          [ ${#files[@]} -eq 0 ] && { echo "No JS files"; exit 0; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "Checked ${#files[@]} files"

  compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.qnap.yaml config --quiet

  build:
    name: Build web + offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff and Pyflakes
        run: |
          ruff check . --select F
          pyflakes scripts tests
      - run: python -m pytest -q

  docker-smoke:
    name: Docker image + Chromium smoke
    runs-on: ubuntu-latest
    needs: [syntax, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start hardened container
        run: |
          docker run -d --name app -p ${PORT}:8080 \
            --read-only --tmpfs /tmp --tmpfs /data:rw,uid=1000,gid=1000,size=64m \
            -e PB_ADMIN_EMAIL="$SMOKE_ADMIN_EMAIL" -e PB_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 200 --memory 256m \
            "$IMAGE"
      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/health" && exit 0
            sleep 1
          done
          echo "::error::/health never became ready"; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:${{ env.PORT }}
          PB_ADMIN_EMAIL: ${{ env.SMOKE_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ env.SMOKE_ADMIN_PASSWORD }}
      - name: Access log is one logwatch JSON object per line
        run: |
          docker logs app > app.log 2>&1
          python3 - app.log <<'PY'
          import json, sys
          lines = [l for l in open(sys.argv[1], encoding="utf-8").read().splitlines() if l.strip()]
          banner = ("Server started", "├─", "└─")
          records, bad = [], []
          for l in lines:
              try:
                  records.append(json.loads(l))
              except ValueError:
                  if not any(b in l for b in banner):
                      bad.append(l)
          need = {"timestamp", "level", "method", "path", "status_code", "duration_ms", "client", "user_agent"}
          missing = [r for r in records if not need <= r.keys()]
          assert not bad, f"non-JSON log lines: {bad[:5]}"
          assert not missing, f"records missing fields: {missing[:3]}"
          assert any(r["path"] == "/health" and r["status_code"] == 200 for r in records), "no /health access lines"
          assert any(r["status_code"] == 401 for r in records), "auth failures not logged with their status"
          print(f"{len(records)} JSON access lines OK")
          PY
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Container logs
        if: failure()
        run: docker logs app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
