# Local build
services:
  brewcrm:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
    image: ${IMAGE:-brewcrm:local}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - brewcrm-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    shm_size: 64m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }


volumes:
  brewcrm-data:
